name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the pinned dependencies
        run: pip install -r requirements-lock.txt

      - name: Run the test suite
        run: python -m pytest tests -q -n auto

      - name: Reproduce the paper tables from the CSVs
        run: python reproduce.py --check
